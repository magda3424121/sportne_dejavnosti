<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Registracija - Športne Rezervacije</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-card { max-width: 400px; margin: 80px auto; border-radius: 15px; }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="card auth-card shadow p-4">
            <h3 class="text-center mb-4">Ustvari račun</h3>
            <div class="mb-2">
                <input type="text" id="reg-ime" class="form-control" placeholder="Ime">
            </div>
            <div class="mb-2">
                <input type="text" id="reg-priimek" class="form-control" placeholder="Priimek">
            </div>
            <div class="mb-2">
                <input type="email" id="reg-email" class="form-control" placeholder="E-mail">
            </div>
            <div class="mb-2">
                <input type="text" id="reg-tel" class="form-control" placeholder="Telefon">
            </div>
            <div class="mb-3">
                <input type="password" id="reg-geslo" class="form-control" placeholder="Izberite geslo">
            </div>
            <button class="btn btn-success w-100" onclick="registracija()">Registriraj se</button>
            <p class="text-center mt-3">Že imate račun? <a href="prijava.html">Prijavite se</a></p>
        </div>
    </div>

    <script>
        async function registracija() {
            const u = {
                ime: document.getElementById('reg-ime').value,
                priimek: document.getElementById('reg-priimek').value,
                email: document.getElementById('reg-email').value,
                telefon: document.getElementById('reg-tel').value,
                geslo: document.getElementById('reg-geslo').value,
                vrstaUporabnika: "uporabnik"
            };

            if(!u.email || !u.geslo) { alert("Email in geslo sta obvezna!"); return; }

            const res = await fetch('/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(u)
            });

            if (res.ok) {
                alert("Račun ustvarjen! Zdaj se lahko prijaviš.");
                window.location.href = "prijava.html";
            } else {
                alert("Napaka pri registraciji (morda e-mail že obstaja).");
            }
        }
    </script>
</body>
</html>
