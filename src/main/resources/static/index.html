<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Sistem za Rezervacije</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .dvorana-card { cursor: pointer; transition: 0.3s; border-radius: 15px; border: none; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .dvorana-card:hover { transform: translateY(-5px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        .bg-primary { background-color: #0d6efd !important; }
    </style>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-primary mb-4 shadow">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Športni Rezervacijski Sistem</span>
        <div id="user-info" class="d-flex align-items-center">
            <span id="ime-prijavljenega" class="text-white me-3 fw-bold"></span>
            <a href="admin.html" id="admin-button" class="btn btn-warning btn-sm me-2 d-none">Admin Panel</a>
            <button class="btn btn-outline-light btn-sm" onclick="odjava()">Odjava</button>
        </div>
    </div>
</nav>

<div class="container">
    <div id="main-content">
        <div class="row mb-4 align-items-center">
            <div class="col">
                <h2 class="fw-bold">Izberite dvorano</h2>
                <p class="text-muted">Kliknite na dvorano za ogled zasedenosti in rezervacijo.</p>
            </div>
        </div>
        
        <div id="izbira-dvorane" class="row g-4">
            </div>
    </div>
</div>

<script>
    window.onload = function() {
        const u = JSON.parse(localStorage.getItem('prijavljenUporabnik'));
        
        if (!u) {
            window.location.href = "prijava.html";
            return;
        }

        // Prikaz imena
        document.getElementById('ime-prijavljenega').innerText = u.ime + " " + u.priimek;

        // LOGIKA ZA ADMIN GUMB: Preverimo oba možna zapisa polja iz baze
        const vloga = u.vrsta_uporabnika || u.vrstaUporabnika;
        if (vloga === 'admin') {
            const adminBtn = document.getElementById('admin-button');
            if (adminBtn) adminBtn.classList.remove('d-none');
        }

        naloziDvorane();
    };

    function odjava() {
        localStorage.removeItem('prijavljenUporabnik');
        window.location.href = "prijava.html";
    }

    async function naloziDvorane() {
        try {
            const res = await fetch('/sportne-dvorane');
            const dvorane = await res.json();
            const container = document.getElementById('izbira-dvorane');
            
            container.innerHTML = dvorane.map(d => `
                <div class="col-md-4">
                    <div class="card dvorana-card h-100" onclick='prikaziPodrobnosti(${JSON.stringify(d)})'>
                        <div class="card-body">
                            <h5 class="card-title text-primary fw-bold">${d.ime}</h5>
                            <p class="card-text mb-1"><strong>Center:</strong> ${d.imeCentra || 'Neznano'}</p>
                            <p class="card-text mb-1"><strong>Kraj:</strong> ${d.imeKraja || '-'}</p>
                            <p class="card-text"><strong>Kapaciteta:</strong> ${d.kapaciteta} oseb</p>
                        </div>
                        <div class="card-footer bg-transparent border-0 text-end">
                            <span class="badge bg-info text-dark">${d.sportiSeznam || 'Vsi športi'}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (error) {
            console.error("Napaka pri nalaganju dvoran:", error);
        }
    }

    function prikaziPodrobnosti(d) {
        localStorage.setItem('izbranaDvorana', JSON.stringify(d));
        window.location.href = "podrobnosti.html";
    }
</script>
</body>
</html>
