<!DOCTYPE html>
<html lang="sl">
<head>
    <meta charset="UTF-8">
    <title>Prijava - Športne Rezervacije</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .auth-card { max-width: 400px; margin: 100px auto; border-radius: 15px; }
    </style>
</head>
<body class="bg-light">
    <div class="container">
        <div class="card auth-card shadow p-4">
            <h3 class="text-center mb-4">Prijava</h3>
            <div class="mb-3">
                <input type="email" id="login-email" class="form-control" placeholder="E-mail">
            </div>
            <div class="mb-3">
                <input type="password" id="login-geslo" class="form-control" placeholder="Geslo">
            </div>
            <button class="btn btn-primary w-100" onclick="prijava()">Vstop</button>
            <p class="text-center mt-3">Nimate računa? <a href="registracija.html">Registracija</a></p>
        </div>
    </div>

    <script>
        async function prijava() {
            const podatki = {
                email: document.getElementById('login-email').value,
                geslo: document.getElementById('login-geslo').value
            };

            const res = await fetch('/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(podatki)
            });

            if (res.ok) {
                const u = await res.json();
                localStorage.setItem('prijavljenUporabnik', JSON.stringify(u));
                window.location.href = "index.html"; // Pošljemo uporabnika na glavno stran
            } else {
                alert("Napačen email ali geslo!");
            }
        }
    </script>
</body>
</html>
